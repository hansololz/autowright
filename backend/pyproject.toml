[project]
name = "autowright"
version = "0.10.1"
description = "Autowright backend — local automation service, engine, and CLI"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",  # imported first-hand (models.py §19 request models), not just via fastapi
    "uvicorn>=0.30",
    "websockets>=12.0",  # uvicorn's WS implementation — plain uvicorn rejects upgrades without it
    "PyYAML>=6.0",
    "keyring>=25.0",
    "packaging>=24.0",  # §6.2 outdated check: version ordering + wheel-tag compatibility
    # §17: Windows has no system IANA tz database (and python-build-standalone ships none) —
    # without this, zoneinfo resolves nothing and every timezone-bearing trigger fails.
    'tzdata; sys_platform == "win32"',
    # Curated step packages (§6.2) — ship inside the bundled interpreter.
    "requests>=2.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.5", "httpx>=0.27"]

[project.scripts]
autowright = "autowright.cli:main"
autowright-backend = "autowright.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autowright*"]

[tool.setuptools.package-data]
autowright = ["instructions/*.md"]
